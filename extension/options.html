<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MS-CHRN Sync options</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 24px; color: #222; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    .row { display: flex; gap: 12px; } .row > div { flex: 1; }
    button { margin-top: 16px; padding: 8px 14px; }
    pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <h2>MS-CHRN Sync</h2>
  <label for="endpoint">Workbook endpoint (Apps Script web app /exec URL)</label>
  <input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="key">Key (same value as the INGEST_KEY script property)</label>
  <input id="key" type="password">
  <div class="row">
    <div><label for="days">Days to re-read each sync</label><input id="days" type="number" min="1"></div>
    <div><label for="intervalMin">Sync every (minutes)</label><input id="intervalMin" type="number" min="15"></div>
  </div>
  <button id="save">Save</button> <button id="sync">Save and sync now</button>
  <h3>Last sync</h3>
  <pre id="status">-</pre>
  <script src="options.js"></script>
</body>
</html>
